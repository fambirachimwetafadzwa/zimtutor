# Minimal Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings (email confirmation, SMTP, rate limits, CAPTCHA) are configured in the
# Supabase dashboard; see README "Deployment".
project_id = "zimtutor"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
